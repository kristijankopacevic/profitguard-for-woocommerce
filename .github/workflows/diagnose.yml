name: Diagnose lint scope
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist -q
      - name: Write reports to files
        run: |
          mkdir -p reports
          vendor/bin/phpcs --report=source --parallel=1 --no-colors . > reports/source.txt 2>&1 || true
          vendor/bin/phpcs --report=full --parallel=1 --no-colors --report-width=110 . > reports/full.txt 2>&1 || true
          echo "--- source ---"; cat reports/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-reports
          path: reports/

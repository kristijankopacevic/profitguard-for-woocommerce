name: Diagnose lint scope
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist -q
      - name: What phpcs actually scans
        run: |
          echo "### php files present, excluding vendor"
          find . -path ./vendor -prune -o -name '*.php' -print | sort > /tmp/present.txt
          wc -l < /tmp/present.txt
          echo "### files appearing in the phpcs json report"
          vendor/bin/phpcs --report=json . > /tmp/cs.json 2>/dev/null || true
          jq -r '.files | keys[]' /tmp/cs.json | sed 's#.*/profitguard-for-woocommerce/##' | sort > /tmp/scanned.txt
          wc -l < /tmp/scanned.txt
          cat /tmp/scanned.txt
          echo "### totals"
          jq -c '.totals' /tmp/cs.json
      - name: Force includes and tests explicitly
        run: |
          echo "### explicit includes/"
          vendor/bin/phpcs --report=summary includes/ 2>&1 | tail -25 || true
          echo "### explicit tests/"
          vendor/bin/phpcs --report=summary tests/ 2>&1 | tail -25 || true
      - name: The Repository.php warnings
        run: vendor/bin/phpcs --report=full includes/Plugin/Repository.php 2>&1 | head -40 || true

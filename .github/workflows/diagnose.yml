name: Diagnose lint scope
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist -q
      - name: Which sniffs are failing, and how often
        run: vendor/bin/phpcs --report=source --parallel=1 . 2>&1 | tail -40 || true
      - name: Full report for the offending files
        run: vendor/bin/phpcs --report=full --parallel=1 --report-width=120 . 2>&1 | head -220 || true

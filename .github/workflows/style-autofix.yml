name: Apply WPCS autofixes

# There is no local PHP on the machine this plugin is developed on, so phpcbf
# runs here. Same pattern as the sibling Cost Importer plugin, with the staged
# paths adjusted to this tree.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer exec phpcbf -- -p
        continue-on-error: true
      - name: Report what is left for a human
        run: composer exec phpcs -- --report=summary --parallel=1
        continue-on-error: true
      - name: Commit safe formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -- profitguard-for-woocommerce.php uninstall.php includes tests bin && git commit -m "Apply WPCS autofixes" && git push)

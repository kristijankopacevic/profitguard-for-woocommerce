name: Apply WPCS autofixes

# There is no local PHP on the machine this plugin is developed on, so phpcbf
# runs here. Same pattern as the sibling Cost Importer plugin, with the staged
# paths adjusted to this tree.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer exec phpcbf -- -p
        continue-on-error: true
      # Written to files and uploaded: scraping a PHPCS report out of the
      # Actions log loses it to ANSI codes and line-prefixing.
      - name: Report what is left for a human
        run: |
          mkdir -p reports
          composer exec phpcs -- --report=source --parallel=1 --no-colors > reports/source.txt 2>&1 || true
          composer exec phpcs -- --report=full --parallel=1 --no-colors --report-width=110 > reports/full.txt 2>&1 || true
          cat reports/source.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-reports
          path: reports/
      - name: Commit safe formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -- profitguard-for-woocommerce.php uninstall.php includes tests bin && git commit -m "Apply WPCS autofixes" && git push)

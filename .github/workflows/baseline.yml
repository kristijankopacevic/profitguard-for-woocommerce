name: Baseline measurement

# Measures the plugin EXACTLY as inherited, before any remediation.
# Every check is continue-on-error so one red does not hide the other three:
# the point of this run is four numbers, not a pass/fail.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Composer install
        id: composer
        continue-on-error: true
        run: composer install --no-interaction --prefer-dist 2>&1 | tee /tmp/composer.log

      # Inlined rather than `composer run syntax`: ProfitGuard's composer.json
      # defines test/lint/verify but no syntax script, unlike Cost Importer's.
      - name: PHP syntax sweep
        id: syntax
        continue-on-error: true
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null 2>>/tmp/syntax.log || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          echo "syntax_failed=$fail" >> "$GITHUB_OUTPUT"
          exit $fail

      - name: PHPUnit
        id: phpunit
        continue-on-error: true
        run: vendor/bin/phpunit --configuration phpunit.xml.dist 2>&1 | tee /tmp/phpunit.log

      - name: PHPCS
        id: phpcs
        continue-on-error: true
        run: vendor/bin/phpcs --report=summary 2>&1 | tee /tmp/phpcs.log

      - name: Baseline summary
        if: always()
        run: |
          {
            echo "## Baseline measurement (code as inherited, no edits)"
            echo ""
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| composer install | ${{ steps.composer.outcome }} |"
            echo "| php -l sweep | ${{ steps.syntax.outcome }} |"
            echo "| phpunit | ${{ steps.phpunit.outcome }} |"
            echo "| phpcs | ${{ steps.phpcs.outcome }} |"
            echo ""
            echo "### PHPUnit tail"
            echo '```'
            tail -25 /tmp/phpunit.log 2>/dev/null || echo "(no phpunit output)"
            echo '```'
            echo "### PHPCS summary tail"
            echo '```'
            tail -30 /tmp/phpcs.log 2>/dev/null || echo "(no phpcs output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-logs
          path: /tmp/*.log
          if-no-files-found: warn
